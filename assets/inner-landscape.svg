<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
<title id="title">A universe within a human</title><desc id="desc">An abstract, warm landscape with a quiet human silhouette beneath a subtle celestial sky.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8aa92"/><stop offset=".48" stop-color="#6d7471"/><stop offset="1" stop-color="#27333b"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#f0d8ad" stop-opacity=".95"/><stop offset="1" stop-color="#e9cda0" stop-opacity="0"/></radialGradient>
 <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c3a985"/><stop offset="1" stop-color="#615f56"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer></filter>
</defs>
<rect width="900" height="1100" fill="url(#sky)"/>
<circle cx="650" cy="260" r="250" fill="url(#sun)"/>
<circle cx="650" cy="260" r="78" fill="#e7d4b5" opacity=".62"/>
<g fill="none" stroke="#efe4d1" opacity=".32"><ellipse cx="640" cy="300" rx="260" ry="95" transform="rotate(-28 640 300)"/><ellipse cx="640" cy="300" rx="310" ry="135" transform="rotate(-28 640 300)"/><path d="M95 280 Q300 90 500 180"/></g>
<g fill="#f3e7d3" opacity=".75"><circle cx="168" cy="150" r="2"/><circle cx="260" cy="235" r="1.5"/><circle cx="775" cy="120" r="2"/><circle cx="520" cy="100" r="1.4"/><circle cx="820" cy="420" r="1.5"/></g>
<path d="M0 620 Q170 520 335 600 T670 560 T900 610 V1100 H0Z" fill="#7e8175" opacity=".75"/>
<path d="M0 730 Q180 630 360 710 T690 680 T900 735 V1100 H0Z" fill="url(#land)"/>
<path d="M0 870 Q240 760 440 860 T900 820 V1100 H0Z" fill="#4e5753" opacity=".78"/>
<ellipse cx="450" cy="920" rx="235" ry="54" fill="#d7bd94" opacity=".2" filter="url(#blur)"/>
<g transform="translate(435 540)">
 <ellipse cx="0" cy="35" rx="25" ry="31" fill="#252e32"/>
 <path d="M-33 70 Q-8 52 16 70 L34 205 Q4 230 -38 205Z" fill="#293239"/>
 <path d="M-20 202 L-34 360 L-8 360 L7 230 L16 360 L42 360 L30 202Z" fill="#293239"/>
 <path d="M-32 87 Q-65 145 -75 205" stroke="#293239" stroke-width="17" stroke-linecap="round" fill="none"/>
 <path d="M25 90 Q53 135 63 190" stroke="#293239" stroke-width="16" stroke-linecap="round" fill="none"/>
</g>
<path d="M0 1015 Q210 930 430 1010 T900 980 V1100 H0Z" fill="#252f31" opacity=".65"/>
<rect width="900" height="1100" filter="url(#grain)" opacity=".7"/>
</svg>
