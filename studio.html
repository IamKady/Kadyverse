<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5ef">
    <meta name="robots" content="noindex,nofollow">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <title>Private Studio — KadyVerse</title>
  </head>
  <body class="studio-body">
    <a class="skip-link" href="#studio-main">Skip to studio</a>
    <header class="studio-header">
      <a class="wordmark" href="/" aria-label="KadyVerse home">KADYVERSE<span class="wordmark-period">.</span></a>
      <span class="studio-header-label">A private writing space</span>
      <a class="studio-exit" href="/">Back to KadyVerse <span aria-hidden="true">↗</span></a>
    </header>
    <main id="studio-main" class="studio-main">
      <p class="studio-loading" role="status">Opening your writing space…</p>
    </main>
    <script src="/supabase-config.js" defer></script>
    <script src="/studio/studio.js" defer></script>
  </body>
</html>
